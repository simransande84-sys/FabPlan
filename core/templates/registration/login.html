<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - FabPlan</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body style="display: flex; justify-content: center; align-items: center; min-height: 100vh; background: var(--bg-color);">
    <div class="container" style="max-width: 400px; margin: 0; width: 100%;">
        <div class="d-card" style="background: var(--card-bg); border-color: var(--border-color); color: var(--text-main); padding: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
            <h2 style="text-align: center; margin-bottom: 20px; color: var(--text-main); font-size: 1.5rem; font-weight: 600;">Log In to FabPlan</h2>
            
            {% if form.errors %}
                <div class="alert alert-error">
                    Your username and password didn't match. Please try again.
                </div>
            {% endif %}

            <form method="post" action="{% url 'login' %}">
                {% csrf_token %}
                <div class="form-group">
                    <label for="id_username">Username</label>
                    <input type="text" name="username" autofocus autocapitalize="none" autocomplete="username" maxlength="150" required id="id_username" class="form-control">
                </div>
                <div class="form-group">
                    <label for="id_password">Password</label>
                    <input type="password" name="password" autocomplete="current-password" required id="id_password" class="form-control">
                </div>
                
                <button type="submit" class="btn-submit" style="width: 100%; margin-top: 10px;">Log In</button>
                <input type="hidden" name="next" value="{{ next }}">
            </form>
            
            <div style="text-align: center; margin-top: 20px; font-size: 0.85rem; color: var(--text-muted);">
                <p>Don't have an account? <a href="{% url 'signup' %}" style="color: var(--primary); text-decoration: none;">Sign up</a></p>
                <p style="margin-top: 10px;">For testing, use the Django admin account.</p>
            </div>
        </div>
    </div>
</body>
</html>
